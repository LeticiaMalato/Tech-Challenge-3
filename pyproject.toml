[project]
name = "triage-classifier"
version = "0.1.0"
description = "Sistema de triagem automática de laudos médicos por urgência (Tech Challenge Fase 3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "prometheus-client>=0.21.0",
    "joblib>=1.4.0",
    "skl2onnx>=1.17.0",
    "onnxruntime>=1.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/app", "tests", "scripts"]
extend-exclude = ["src/notebook"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle (docstrings)
    "ANN", # flake8-annotations (type hints obrigatórios)
]
ignore = [
    "D203",  # incompatível com D211
    "D213",  # incompatível com D212
    "ANN101",  # self não precisa de type hint — prática padrão em Python
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]  # testes não exigem docstring/annotation completa
"src/app/core/interfaces.py" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
